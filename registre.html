<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <nav class="nav-bar"></nav>
    </header>

    <main class="main-register">

        <aside class="register-sidebar">
            <div class="sidebar-image"></div>
            <div class="sidebar-text"></div>
        </aside>

        <section class="register-container">

            <form class="register-box">
                <div class="form-user"></div>
                <div class="form-mail"></div>
                <div class="form-password"></div>
                <div class="form-passwordconfirm"></div>
                <div class="form-date"></div>
                <div class="form-options"></div>
                <button type="button" class="btn-submit"></button>
            </form>

        </section>

    </main>
    <footer class="footer"></footer>
</body>

</html>
